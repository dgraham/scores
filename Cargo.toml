[package]
name = "scores"
version = "1.0.0"
authors = ["David Graham <david.malcom.graham@gmail.com>"]
description = "String similarity ranking for Vim's CtrlP fuzzy file finder."
repository = "https://github.com/dgraham/scores"
license = "MIT"
edition = "2024"

[dependencies]
getopts = "0.2.24"
regex = "1.13.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
